apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-docker-lab
spec:
  replicas: 4
  selector:
    matchLabels:
      app: k8s-docker-lab
  template:
    metadata:
      labels:
        app: k8s-docker-lab
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: k8s-docker-lab
      containers:
        - name: web
          image: kshitijkardile/k8s-docker-lab:v1
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-docker-service
spec:
  type: NodePort
  selector:
    app: k8s-docker-lab
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
